name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare enabled Quartz plugin lockfile
        run: node scripts/restore-enabled-quartz-plugins.mjs --prepare-only
      - name: Cache built Quartz plugins
        id: quartz-plugins-cache
        uses: actions/cache@v4
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-node22-quartz-plugins-${{ hashFiles('.quartz/enabled-quartz.lock.json') }}
      - name: Restore enabled Quartz plugins
        if: steps.quartz-plugins-cache.outputs.cache-hit != 'true'
        run: node scripts/restore-enabled-quartz-plugins.mjs
      - name: Patch Quartz plugins for GitHub Pages subpath
        run: node scripts/patch-quartz-subpath.mjs
      - name: Build Quartz
        run: npx quartz build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
