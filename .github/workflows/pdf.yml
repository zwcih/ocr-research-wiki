name: Publish PDF

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF toolchain and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-lang-chinese fonts-noto-cjk lmodern
      - name: Assemble book
        run: python3 scripts/build_book.py
      - name: Generate PDF
        run: |
          pandoc build/ocr-research-wiki.md \
            --from markdown+tex_math_dollars \
            --pdf-engine=xelatex \
            --toc --number-sections \
            -V documentclass=ctexbook \
            -V classoption=openany \
            -V geometry:margin=2.2cm \
            -V colorlinks=true \
            -V linkcolor=blue \
            -V urlcolor=blue \
            -o OCR-Research-Wiki.pdf
      - name: Publish rolling PDF release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-pdf
          name: 最新 PDF 版
          body: 此 Release 由 GitHub Actions 定期更新。
          make_latest: false
          files: OCR-Research-Wiki.pdf
          overwrite_files: true
